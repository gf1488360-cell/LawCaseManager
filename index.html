<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>کیس مینجمنٹ </title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5efe3; font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif; color: #2c2418; padding: 12px 12px 40px; }
    .container { max-width: 700px; margin: 0 auto; width: 100%; }
    .header { background: #7b2c1a; color: #fdf0e0; padding: 14px 16px; border-radius: 28px; margin-bottom: 20px; text-align: center; position: relative; }
    .header h1 { font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .header p { font-size: 0.7rem; opacity: 0.85; margin-top: 4px; }
    .calendar-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: #fdf0e0; border: none; border-radius: 40px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; font-family: inherit; color: #7b2c1a; font-weight: bold; }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab { flex: 1; text-align: center; padding: 10px 8px; background: #e8dfd1; border-radius: 40px; font-weight: 700; cursor: pointer; color: #4a3a26; font-size: 0.85rem; }
    .tab.active { background: #7b2c1a; color: white; }
    .btn-add { background: #2c5f2d; color: white; border: none; padding: 10px 18px; border-radius: 40px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.85rem; width: 100%; text-align: center; margin-bottom: 12px; }
    .search-box { margin-bottom: 16px; }
    .search-box input { width: 100%; padding: 10px 16px; border-radius: 40px; border: 1.5px solid #e2d2b6; background: white; font-family: inherit; font-size: 0.85rem; text-align: right; }
    .case-list { display: flex; flex-direction: column; gap: 12px; }
    .case-item { background: white; border-radius: 24px; padding: 14px; border-right: 5px solid #2c6e2c; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
    .case-top-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .case-name { font-weight: 700; font-size: 1rem; word-break: break-word; }
    .case-badge { font-size: 0.7rem; background: #f0e9dd; padding: 4px 12px; border-radius: 30px; }
    .case-info-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .case-judge { font-size: 0.75rem; color: #7b2c1a; background: #faf0e2; padding: 4px 12px; border-radius: 30px; }
    .case-type-badge { font-size: 0.7rem; background: #e8e0d0; padding: 4px 12px; border-radius: 30px; }
    .empty-msg { text-align: center; padding: 40px 20px; color: #a48f6e; background: #fffaf2; border-radius: 28px; }
    .detail-view { background: white; border-radius: 28px; padding: 16px; margin-top: 8px; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #eedfc8; }
    .back-btn { background: #e8dfd1; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; }
    .case-title { font-size: 1.1rem; font-weight: 700; color: #7b2c1a; word-break: break-word; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fef8ef; padding: 14px; border-radius: 20px; margin-bottom: 18px; }
    .info-item { font-size: 0.8rem; word-break: break-word; }
    .info-label { font-weight: 600; color: #8b6b48; display: block; margin-bottom: 3px; font-size: 0.7rem; }
    .info-value { font-weight: 500; font-size: 0.85rem; }
    .criminal-fields-in-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e2d2b6; grid-column: span 2; }
    .action-buttons { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
    .btn { padding: 7px 14px; border-radius: 40px; border: none; font-family: inherit; font-weight: 600; cursor: pointer; font-size: 0.75rem; }
    .btn-primary { background: #2c5f2d; color: white; }
    .btn-warning { background: #c97e3a; color: white; }
    .btn-danger { background: #b13e28; color: white; }
    .btn-secondary { background: #ddd0bc; color: #2c2418; }
    .btn-pdf { background: #7b2c1a; color: white; }
    .timeline-title { font-size: 0.95rem; font-weight: 700; margin: 14px 0 10px; }
    .timeline-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .timeline-item { background: #faf5ea; border-radius: 20px; padding: 10px; border-right: 4px solid #b2966e; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .timeline-date { font-weight: 700; font-size: 0.8rem; min-width: 90px; }
    .timeline-note { flex: 2; font-size: 0.75rem; color: #4a3a26; word-break: break-word; }
    .delete-record { background: none; border: none; font-size: 1rem; cursor: pointer; color: #b13e28; padding: 4px 8px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: #fffbf2; width: 100%; max-width: 480px; border-radius: 32px; padding: 20px; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; text-align: center; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1.5px solid #e2d2b6; border-radius: 20px; background: white; font-family: inherit; font-size: 0.85rem; }
    .flex-btns { display: flex; gap: 10px; margin-top: 16px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1f2a1b; color: #faf0dd; padding: 8px 20px; border-radius: 40px; font-size: 0.75rem; transition: 0.2s; z-index: 1000; white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .calendar-list { max-height: 400px; overflow-y: auto; }
    .calendar-item { background: #fef5e9; border-radius: 20px; padding: 10px 12px; margin-bottom: 8px; border-right: 3px solid #7b2c1a; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .calendar-item .case-name-small { font-weight: 600; font-size: 0.85rem; flex: 2; }
    .calendar-item .case-file-small { font-size: 0.7rem; color: #8b6b48; }
    .calendar-buttons { display: flex; gap: 6px; }
    .open-case-btn-small, .pdf-case-btn-small { background: #2c5f2d; color: white; border: none; border-radius: 30px; padding: 4px 10px; cursor: pointer; font-size: 0.7rem; }
    .pdf-case-btn-small { background: #7b2c1a; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2d2b6; flex-wrap: wrap; gap: 8px; }
    .download-all-btn { background: #2c5f2d; color: white; border: none; border-radius: 30px; padding: 5px 12px; font-size: 0.7rem; cursor: pointer; }
    .dynamic-fields { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e2d2b6; }
    @media (max-width: 480px) { .case-top-row { flex-direction: column; align-items: flex-start; } .case-badge { align-self: flex-start; } .btn { white-space: normal; flex: 1; text-align: center; } .calendar-item { flex-direction: column; align-items: flex-start; } .calendar-buttons { margin-top: 5px; } }
    @media print { .header, .tabs, .action-buttons, .back-btn, .calendar-icon, .delete-record, .btn, .modal-overlay, .toast, .btn-add, .search-box { display: none !important; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <button class="calendar-icon" id="openCalendarBtn">📅 کیلنڈر</button>
    <h1>⚖️ کیس مینجمنٹ</h1>
    <p>Adv. Abdul Mujeeb</p>
  </div>
  <div class="tabs">
    <div class="tab active" data-status="active">فعال کیسز</div>
    <div class="tab" data-status="closed">بند کیسز</div>
  </div>
  <button id="addNewCaseBtn" class="btn-add">➕ نیا کیس شامل کریں</button>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 مدعی یا مدعا علیہ کے نام سے تلاش کریں">
  </div>
  
  <div id="caseListView"><div id="caseListContainer" class="case-list"></div></div>
  <div id="detailView" style="display: none;"></div>
</div>

<!-- Modal: Add/Edit Case -->
<div id="caseModal" class="modal-overlay"><div class="modal-card"><div class="modal-title" id="caseModalTitle">نیا کیس</div>
<input type="text" id="plaintiff" placeholder="مدعی (Plaintiff)"><input type="text" id="defendant" placeholder="مدعا علیہ (Defendant)">
<input type="text" id="judge" placeholder="جج کا نام (Judge)"><input type="text" id="representing" placeholder="مدافع کی طرف سے">
<input type="text" id="casetype" list="caseTypesList" placeholder="کیس کی قسم (ٹائپ کریں یا منتخب کریں)" autocomplete="off">
<datalist id="caseTypesList">
  <!-- Civil & General -->
  <option value="دیوانی مقدمہ (Civil Suit)">دیوانی مقدمہ (Civil Suit)</option>
  <option value="فوجداری مقدمہ (Criminal Case)">فوجداری مقدمہ (Criminal Case)</option>
  <option value="دیوانی اپیل (Civil Appeal)">دیوانی اپیل (Civil Appeal)</option>
  <option value="ثانوی اپیل (Second Appeal)">ثانوی اپیل (Second Appeal)</option>
  <option value="ہائی کورٹ اپیل (High Court Appeal)">ہائی کورٹ اپیل (High Court Appeal)</option>
  <option value="انٹرا کورٹ اپیل (Intra Court Appeal)">انٹرا کورٹ اپیل (Intra Court Appeal)</option>
  <option value="آئینی درخواست (Constitutional Petition)">آئینی درخواست (Constitutional Petition)</option>
  <option value="رٹ درخواست (Writ Petition)">رٹ درخواست (Writ Petition)</option>
  <option value="دیوانی نظرثانی (Civil Revision)">دیوانی نظرثانی (Civil Revision)</option>
  <option value="فوجداری نظرثانی (Criminal Revision)">فوجداری نظرثانی (Criminal Revision)</option>
  <option value="ضمانت درخواست (Bail Application)">ضمانت درخواست (Bail Application)</option>
  <option value="دیوانی اصل (Civil Original)">دیوانی اصل (Civil Original)</option>
  <option value="فوجداری اصل (Criminal Original)">فوجداری اصل (Criminal Original)</option>
  <option value="خلع (Khula / Dissolution of Marriage)">خلع (Khula / Dissolution of Marriage)</option>
  <option value="طلاق (Divorce / Talaq)">طلاق (Divorce / Talaq)</option>
  <option value="نان نفقہ (Maintenance)">نان نفقہ (Maintenance)</option>
  <option value="جہیز و تحائف (Dowry Articles)">جہیز و تحائف (Dowry Articles)</option>
  <option value="حق مہر (Dower)">حق مہر (Dower)</option>
  <option value="بچوں کی حوالگی (Custody of Children)">بچوں کی حوالگی (Custody of Children)</option>
  <option value="سرپرستی (Guardianship)">سرپرستی (Guardianship)</option>
  <option value="ملاقات کے حقوق (Visitation Rights)">ملاقات کے حقوق (Visitation Rights)</option>
  <option value="ازدواجی تعلقات کی بحالی (Restitution of Conjugal Rights)">ازدواجی تعلقات کی بحالی (Restitution of Conjugal Rights)</option>
  <option value="تقسیم جائیداد (Partition Suit)">تقسیم جائیداد (Partition Suit)</option>
  <option value="قبضہ (Possession Suit)">قبضہ (Possession Suit)</option>
  <option value="معاہدہ پر عملدرآمد (Specific Performance)">معاہدہ پر عملدرآمد (Specific Performance)</option>
  <option value="دعویٰ شفعہ (Pre-emption Suit)">دعویٰ شفعہ (Pre-emption Suit)</option>
  <option value="کرایہ داری (Rent Case)">کرایہ داری (Rent Case)</option>
  <option value="اعلانیہ دعویٰ (Suit for Declaration)">اعلانیہ دعویٰ (Suit for Declaration)</option>
  <option value="حکم امتناعی (Permanent Injunction)">حکم امتناعی (Permanent Injunction)</option>
  <option value="رقم کی وصولی (Recovery Suit)">رقم کی وصولی (Recovery Suit)</option>
  <option value="دستاویز منسوخی (Cancellation of Document)">دستاویز منسوخی (Cancellation of Document)</option>
  <option value="نقصان (Damages Suit)">نقصان (Damages Suit)</option>
  <option value="توہین (Defamation Suit)">توہین (Defamation Suit)</option>
  <option value="وراثت (Inheritance / Succession)">وراثت (Inheritance / Succession)</option>
  <option value="ٹریڈ مارک / کاپی رائٹ (Trademark / Copyright)">ٹریڈ مارک / کاپی رائٹ (Trademark / Copyright)</option>
  <option value="سروس معاملات (Service Matter)">سروس معاملات (Service Matter)</option>
  <option value="صارفین کا تحفظ (Consumer Protection)">صارفین کا تحفظ (Consumer Protection)</option>
  <option value="دیگر (Other - لکھیں)">دیگر (Other - لکھیں)</option>
</datalist>
<div style="display:flex;gap:8px;"><input type="text" id="code" placeholder="کوڈ" style="flex:1"><input type="text" id="phone" placeholder="فون" dir="ltr" style="flex:1"></div>
<input type="text" id="filenum" placeholder="فائل نمبر">

<!-- Dynamic Criminal Fields -->
<div id="criminalFields" class="dynamic-fields">
  <input type="text" id="policeStation" placeholder="پولیس اسٹیشن (Police Station)">
  <input type="text" id="firNo" placeholder="FIR نمبر">
  <textarea id="offences" rows="2" placeholder="جرائم / دفعات (Offences/Sections)"></textarea>
</div>

<textarea id="statusNote" style="display:none;"></textarea>
<div class="flex-btns"><button class="btn btn-secondary" id="cancelCaseBtn">منسوخ</button><button class="btn btn-primary" id="saveCaseBtn">محفوظ کریں</button></div></div></div>

<div id="dateRecordModal" class="modal-overlay"><div class="modal-card"><div class="modal-title">📅 نئی تاریخ شامل کریں</div>
<input type="date" id="recordDate" required><select id="recordMonth"></select><textarea id="recordNote" rows="2" placeholder="نوٹ"></textarea>
<div class="flex-btns"><button class="btn btn-secondary" id="cancelDateBtn">منسوخ</button><button class="btn btn-primary" id="saveDateBtn">تاریخ شامل کریں</button></div></div></div>

<div id="deleteCodeModal" class="modal-overlay"><div class="modal-card"><div class="modal-title">🔒 حذف کرنے کی تصدیق</div>
<p style="margin-bottom:12px;">کیس حذف کرنے کے لیے کوڈ درج کریں</p><input type="password" id="deleteCode" class="code-input" placeholder="کوڈ درج کریں" maxlength="5">
<div class="flex-btns"><button class="btn btn-secondary" id="cancelDeleteBtn">منسوخ</button><button class="btn btn-danger" id="confirmDeleteBtn">حذف کریں</button></div></div></div>

<div id="calendarModal" class="modal-overlay"><div class="modal-card"><div class="modal-title">📅 سماعتوں کا کیلنڈر</div>
<input type="date" id="calendarDatePicker" value=""><div style="display:flex;gap:8px;margin-bottom:16px;"><button id="todayBtn" class="btn btn-secondary" style="flex:1;">آج کی تاریخ</button><button id="searchCalendarBtn" class="btn btn-primary" style="flex:1;">تلاش کریں</button></div>
<div id="calendarResults" class="calendar-list"></div><div class="flex-btns"><button class="btn btn-secondary" id="closeCalendarBtn">بند کریں</button></div></div></div>

<div id="toastMsg" class="toast"></div>

<script>
  // ------------------- STATE -------------------
  let app = {
    cases: [],
    currentTab: 'active',
    currentView: 'list',
    selectedCaseId: null,
    pendingDeleteCaseId: null,
    editCaseId: null,
    selectedCaseIdForRecord: null,
    searchQuery: '',
    currentCalendarDate: null
  };

  // Helper to check if case type is criminal
  function isCriminalCase(caseType) {
    if (!caseType) return false;
    const criminalKeywords = ['فوجداری', 'Criminal', 'ضمانت', 'Bail', 'فوجداری نظرثانی', 'فوجداری اصل', 'جرائم'];
    return criminalKeywords.some(kw => caseType.includes(kw));
  }

  // Toggle criminal fields visibility in modal
  function toggleCriminalFields() {
    const caseType = document.getElementById('casetype').value;
    const fieldsDiv = document.getElementById('criminalFields');
    if (isCriminalCase(caseType)) {
      fieldsDiv.style.display = 'block';
    } else {
      fieldsDiv.style.display = 'none';
    }
  }

  // Get criminal data from modal
  function getCriminalData() {
    return {
      policeStation: document.getElementById('policeStation').value.trim(),
      firNo: document.getElementById('firNo').value.trim(),
      offences: document.getElementById('offences').value.trim()
    };
  }

  // Set criminal data in modal
  function setCriminalData(data) {
    document.getElementById('policeStation').value = data.policeStation || '';
    document.getElementById('firNo').value = data.firNo || '';
    document.getElementById('offences').value = data.offences || '';
  }

  function getMonthOptions() {
    const months = [];
    const now = new Date();
    for (let i = -6; i <= 12; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      const y = d.getFullYear(), m = d.getMonth() + 1;
      months.push({ value: `${y}-${String(m).padStart(2,'0')}`, label: d.toLocaleString('ur-PK', { month: 'long', year: 'numeric' }) });
    }
    return months;
  }
  function populateMonthDropdown(sel) {
    const months = getMonthOptions();
    sel.innerHTML = months.map(m => `<option value="${m.value}">${m.label}</option>`).join('');
  }
  function saveData() { localStorage.setItem('case_system_dynamic', JSON.stringify(app.cases)); }
  function loadData() {
    const raw = localStorage.getItem('case_system_dynamic');
    if (raw) {
      app.cases = JSON.parse(raw);
      app.cases.forEach(c => {
        if (!c.records) c.records = [];
        if (!c.status) c.status = 'active';
        if (!c.representing) c.representing = '';
        if (!c.judge) c.judge = '';
        if (!c.criminalData) c.criminalData = { policeStation: '', firNo: '', offences: '' };
      });
    } else {
      app.cases = [{
        id: 'c1', plaintiff: 'احمد علی', defendant: 'محمد رضا', judge: 'جسٹس عامر حسین', representing: 'مسٹر خالد وکیل',
        casetype: 'فوجداری مقدمہ (Criminal Case)', code: '101', phone: '03001234567', filenum: '2024/01', status_note: '', status: 'active',
        criminalData: { policeStation: 'ماڈل ٹاؤن تھانہ', firNo: '123/2024', offences: '379 PPC (چوری)' },
        records: [
          { id: 'r1', date: '2024-01-10', month: '2024-01', note: 'پہلی سماعت - ملتوی' },
          { id: 'r2', date: '2024-02-15', month: '2024-02', note: 'دوسری سماعت - دلائل' },
          { id: 'r3', date: new Date().toISOString().slice(0,10), month: new Date().toISOString().slice(0,7), note: 'آج کی سماعت' }
        ]
      }];
      saveData();
    }
  }
  function showToast(msg) { const t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
  function closeAllModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); }

  function getFilteredCases() {
    let filtered = app.cases.filter(c => c.status === app.currentTab);
    if (app.searchQuery.trim()) {
      const q = app.searchQuery.trim().toLowerCase();
      filtered = filtered.filter(c => (c.plaintiff && c.plaintiff.toLowerCase().includes(q)) || (c.defendant && c.defendant.toLowerCase().includes(q)));
    }
    return filtered;
  }

  function renderCaseList() {
    const container = document.getElementById('caseListContainer');
    const filtered = getFilteredCases();
    if (!filtered.length) { container.innerHTML = '<div class="empty-msg">📭 کوئی کیس نہیں ملا</div>'; return; }
    container.innerHTML = filtered.map(c => `
      <div class="case-item" onclick="openCaseDetail('${c.id}')">
        <div class="case-top-row"><span class="case-name">${escapeHtml(c.plaintiff||'?')} vs ${escapeHtml(c.defendant||'?')}</span><span class="case-badge">${c.filenum||'فائل'}</span></div>
        <div class="case-info-row"><span class="case-judge">⚖️ ${escapeHtml(c.judge||'جج نامعلوم')}</span><span class="case-type-badge">📌 ${escapeHtml(c.casetype||'—')}</span></div>
      </div>
    `).join('');
  }

  function updateSearch() { app.searchQuery = document.getElementById('searchInput').value; if (app.currentView === 'list') renderCaseList(); }

  window.openCaseDetail = (id) => {
    const c = app.cases.find(x => x.id === id);
    if (!c) return;
    app.selectedCaseId = id;
    app.currentView = 'detail';
    document.getElementById('caseListView').style.display = 'none';
    renderDetailView(c);
  };

  function renderDetailView(c) {
    const sorted = [...c.records].sort((a,b) => new Date(b.date) - new Date(a.date));
    const recordsHtml = sorted.map(rec => `
      <div class="timeline-item">
        <div class="timeline-date">📅 ${new Date(rec.date).toLocaleDateString('en-GB')}</div>
        <div class="timeline-note">${escapeHtml(rec.note) || '—'}</div>
        <button class="delete-record" onclick="deleteRecord('${c.id}', '${rec.id}')">🗑️</button>
      </div>
    `).join('');
    
    // Criminal details section (if any)
    const criminalHtml = (c.criminalData && (c.criminalData.policeStation || c.criminalData.firNo || c.criminalData.offences)) ? `
      <div class="criminal-fields-in-detail">
        ${c.criminalData.policeStation ? `<div class="info-item"><span class="info-label">پولیس اسٹیشن:</span><span class="info-value">${escapeHtml(c.criminalData.policeStation)}</span></div>` : ''}
        ${c.criminalData.firNo ? `<div class="info-item"><span class="info-label">FIR نمبر:</span><span class="info-value">${escapeHtml(c.criminalData.firNo)}</span></div>` : ''}
        ${c.criminalData.offences ? `<div class="info-item"><span class="info-label">جرائم / دفعات:</span><span class="info-value">${escapeHtml(c.criminalData.offences)}</span></div>` : ''}
      </div>
    ` : '';
    
    document.getElementById('detailView').innerHTML = `
      <div class="detail-view">
        <div class="detail-header"><button class="back-btn" onclick="backToList()">↩️ واپس</button><div class="case-title">${escapeHtml(c.plaintiff)} vs ${escapeHtml(c.defendant)}</div></div>
        <div class="info-grid">
          <div class="info-item"><span class="info-label">مدعی:</span><span class="info-value">${escapeHtml(c.plaintiff||'—')}</span></div>
          <div class="info-item"><span class="info-label">مدعا علیہ:</span><span class="info-value">${escapeHtml(c.defendant||'—')}</span></div>
          <div class="info-item"><span class="info-label">جج:</span><span class="info-value">${escapeHtml(c.judge||'—')}</span></div>
          <div class="info-item"><span class="info-label">مدافع:</span><span class="info-value">${escapeHtml(c.representing||'—')}</span></div>
          <div class="info-item"><span class="info-label">کیس قسم:</span><span class="info-value">${escapeHtml(c.casetype||'—')}</span></div>
          <div class="info-item"><span class="info-label">کوڈ:</span><span class="info-value">${escapeHtml(c.code||'—')}</span></div>
          <div class="info-item"><span class="info-label">فون:</span><span class="info-value" dir="ltr">${escapeHtml(c.phone||'—')}</span></div>
          <div class="info-item"><span class="info-label">فائل نمبر:</span><span class="info-value">${escapeHtml(c.filenum||'—')}</span></div>
          ${criminalHtml}
        </div>
        <div class="action-buttons">
          <button class="btn btn-primary" onclick="editCaseDetails('${c.id}')">✏️ ترمیم</button>
          <button class="btn btn-warning" onclick="openAddRecordModal('${c.id}')">📅 نئی تاریخ</button>
          <button class="btn btn-pdf" onclick="printCasePDF('${c.id}')">🖨️ PDF</button>
          <button class="btn ${c.status === 'active' ? 'btn-danger' : 'btn-primary'}" onclick="toggleCaseStatus('${c.id}')">${c.status === 'active' ? '🔒 بند کریں' : '🔓 فعال کریں'}</button>
          <button class="btn btn-danger" onclick="requestDeleteCase('${c.id}')">🗑️ حذف</button>
        </div>
        <div class="timeline-title">📋 تاریخوں کی تفصیل (${c.records.length})</div>
        <div class="timeline-list">${recordsHtml || '<div class="empty-msg">کوئی تاریخ شامل نہیں</div>'}</div>
      </div>`;
    document.getElementById('detailView').style.display = 'block';
  }

  window.backToList = function() { app.currentView = 'list'; app.selectedCaseId = null; document.getElementById('detailView').style.display = 'none'; document.getElementById('caseListView').style.display = 'block'; renderCaseList(); };

  // PDF print including criminal fields
  window.printCasePDF = (caseId) => {
    const c = app.cases.find(x => x.id === caseId);
    if (!c) return;
    const sorted = [...c.records].sort((a,b) => new Date(a.date) - new Date(b.date));
    const recordsHtml = sorted.map(rec => `<div style="border-bottom:1px solid #e0d5c0; padding:8px 0;"><strong>📅 ${new Date(rec.date).toLocaleDateString('en-GB')}</strong><br><span>${escapeHtml(rec.note) || '—'}</span></div>`).join('');
    const criminalRows = [];
    if (c.criminalData) {
      if (c.criminalData.policeStation) criminalRows.push(`<tr><td style="padding:6px;font-weight:bold;">پولیس اسٹیشن:</td><td>${escapeHtml(c.criminalData.policeStation)}</td>`);
      if (c.criminalData.firNo) criminalRows.push(`<tr><td style="padding:6px;font-weight:bold;">FIR نمبر:</td><td>${escapeHtml(c.criminalData.firNo)}</td>`);
      if (c.criminalData.offences) criminalRows.push(`<tr><td style="padding:6px;font-weight:bold;">جرائم/دفعات:</td><td>${escapeHtml(c.criminalData.offences)}</td>`);
    }
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>کیس ${c.filenum}</title><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Noto Nastaliq Urdu',sans-serif;padding:20px;max-width:700px;margin:0 auto;} .header{text-align:center;margin-bottom:20px;} .info{background:#fef8ef;padding:12px;border-radius:16px;margin-bottom:20px;} table{width:100%;} td{padding:6px;} .footer{text-align:center;margin-top:30px;font-size:0.7rem;}</style></head><body>
      <div class="header"><h1>⚖️ کیس کی تفصیل</h1><p>تاریخ: ${new Date().toLocaleDateString('ur-PK')}</p></div>
      <div class="info"><h3>کیس کی معلومات</h3><table>${[['مدعی',c.plaintiff],['مدعا علیہ',c.defendant],['جج',c.judge],['مدافع',c.representing],['کیس قسم',c.casetype],['کوڈ',c.code],['فون',c.phone],['فائل نمبر',c.filenum], ...criminalRows.map(r => r)].map((row) => Array.isArray(row) ? `<tr><td style="padding:6px;font-weight:bold;">${row[0]}:</td><td>${escapeHtml(row[1]||'—')}</td>` : row).join('')}</table></div>
      <div><h3>📋 تاریخوں کی تفصیل</h3>${recordsHtml || '<p>کوئی تاریخ نہیں</p>'}</div>
      <div class="footer">کیس مینجمنٹ سسٹم</div>
    </body></html>`);
    w.document.close(); w.focus(); w.print(); showToast('پرنٹ ڈائیلاگ کھل رہا ہے');
  };

  // Add/Edit case with criminal data
  function openAddCaseModal() {
    app.editCaseId = null;
    document.getElementById('caseModalTitle').innerText = 'نیا کیس';
    document.getElementById('plaintiff').value = ''; document.getElementById('defendant').value = '';
    document.getElementById('judge').value = ''; document.getElementById('representing').value = '';
    document.getElementById('casetype').value = '';
    document.getElementById('code').value = ''; document.getElementById('phone').value = ''; document.getElementById('filenum').value = '';
    setCriminalData({ policeStation: '', firNo: '', offences: '' });
    toggleCriminalFields();
    document.getElementById('caseModal').classList.add('open');
  }
  window.editCaseDetails = (id) => {
    const c = app.cases.find(x => x.id === id);
    if (!c) return;
    app.editCaseId = id;
    document.getElementById('caseModalTitle').innerText = 'کیس میں ترمیم';
    document.getElementById('plaintiff').value = c.plaintiff || '';
    document.getElementById('defendant').value = c.defendant || '';
    document.getElementById('judge').value = c.judge || '';
    document.getElementById('representing').value = c.representing || '';
    document.getElementById('casetype').value = c.casetype || '';
    document.getElementById('code').value = c.code || '';
    document.getElementById('phone').value = c.phone || '';
    document.getElementById('filenum').value = c.filenum || '';
    setCriminalData(c.criminalData || { policeStation: '', firNo: '', offences: '' });
    toggleCriminalFields();
    document.getElementById('caseModal').classList.add('open');
  };
  function saveCaseHandler() {
    const plaintiff = document.getElementById('plaintiff').value.trim();
    const defendant = document.getElementById('defendant').value.trim();
    if (!plaintiff && !defendant) { showToast('مدعی یا مدعا علیہ ضروری'); return; }
    const data = {
      plaintiff, defendant,
      judge: document.getElementById('judge').value.trim(),
      representing: document.getElementById('representing').value.trim(),
      casetype: document.getElementById('casetype').value.trim(),
      code: document.getElementById('code').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      filenum: document.getElementById('filenum').value.trim(),
      status_note: '', status: 'active', records: [],
      criminalData: getCriminalData()
    };
    if (!data.casetype) data.casetype = 'دیگر';
    if (app.editCaseId) {
      const idx = app.cases.findIndex(c => c.id === app.editCaseId);
      if (idx !== -1) { app.cases[idx] = { ...app.cases[idx], ...data, records: app.cases[idx].records }; showToast('کیس اپ ڈیٹ'); }
    } else {
      const newId = 'c' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
      app.cases.push({ id: newId, ...data, records: [] });
      showToast('نیا کیس شامل');
    }
    saveData(); closeAllModals();
    if (app.currentView === 'list') renderCaseList();
    else if (app.currentView === 'detail' && app.selectedCaseId) { const upd = app.cases.find(c => c.id === app.selectedCaseId); if (upd) renderDetailView(upd); }
  }

  window.openAddRecordModal = (caseId) => {
    app.selectedCaseIdForRecord = caseId;
    populateMonthDropdown(document.getElementById('recordMonth'));
    document.getElementById('recordDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('recordNote').value = '';
    document.getElementById('dateRecordModal').classList.add('open');
  };
  function addRecordHandler() {
    const c = app.cases.find(x => x.id === app.selectedCaseIdForRecord);
    if (!c) return;
    const date = document.getElementById('recordDate').value;
    const month = document.getElementById('recordMonth').value;
    const note = document.getElementById('recordNote').value.trim();
    if (!date || !month) { showToast('تاریخ اور مہینہ درج کریں'); return; }
    c.records.push({ id: 'r' + Date.now() + '_' + Math.random().toString(36).substr(2,4), date, month, note });
    saveData(); closeAllModals();
    if (app.currentView === 'detail' && app.selectedCaseId === app.selectedCaseIdForRecord) renderDetailView(c);
    showToast('تاریخ شامل ہوگئی');
  }

  window.deleteRecord = (caseId, recordId) => {
    if (!confirm('کیا آپ یہ تاریخ حذف کرنا چاہتے ہیں؟')) return;
    const c = app.cases.find(x => x.id === caseId);
    if (c) { c.records = c.records.filter(r => r.id !== recordId); saveData(); if (app.currentView === 'detail' && app.selectedCaseId === caseId) renderDetailView(c); showToast('تاریخ حذف'); }
  };
  window.toggleCaseStatus = (id) => {
    const c = app.cases.find(x => x.id === id);
    if (c) { c.status = c.status === 'active' ? 'closed' : 'active'; saveData(); if (app.currentView === 'detail' && app.selectedCaseId === id) renderDetailView(c); else renderCaseList(); showToast(c.status === 'active' ? 'کیس فعال' : 'کیس بند'); }
  };
  window.requestDeleteCase = (id) => { app.pendingDeleteCaseId = id; document.getElementById('deleteCode').value = ''; document.getElementById('deleteCodeModal').classList.add('open'); };
  function confirmDeleteWithCode() {
    if (document.getElementById('deleteCode').value === '98765') {
      app.cases = app.cases.filter(c => c.id !== app.pendingDeleteCaseId);
      saveData(); closeAllModals();
      if (app.currentView === 'detail') backToList(); else renderCaseList();
      showToast('کیس حذف ہوگیا');
    } else { showToast('غلط کوڈ!'); closeAllModals(); }
    app.pendingDeleteCaseId = null;
  }

  // Calendar
  function openCalendar() { const today = new Date().toISOString().slice(0,10); document.getElementById('calendarDatePicker').value = today; showHearingsForDate(today); document.getElementById('calendarModal').classList.add('open'); }
  function showHearingsForDate(date) {
    app.currentCalendarDate = date;
    const resultsDiv = document.getElementById('calendarResults');
    const hearings = [];
    app.cases.forEach(c => {
      c.records.forEach(rec => {
        if (rec.date === date) {
          hearings.push({ caseId: c.id, caseName: `${c.plaintiff||'?'} vs ${c.defendant||'?'}`, filenum: c.filenum });
        }
      });
    });
    if (!hearings.length) { resultsDiv.innerHTML = '<div style="text-align:center;padding:20px;">📭 اس تاریخ پر کوئی سماعت نہیں</div>'; return; }
    resultsDiv.innerHTML = `
      <div class="calendar-header">
        <span>📋 کل سماعتیں: ${hearings.length}</span>
        <button class="download-all-btn" onclick="downloadAllHearingsForDate()">📥 تمام سماعتیں ڈاؤن لوڈ کریں</button>
      </div>
      ${hearings.map(h => `
        <div class="calendar-item">
          <span class="case-name-small">⚖️ ${escapeHtml(h.caseName)}</span>
          <span class="case-file-small">${escapeHtml(h.filenum)}</span>
          <div class="calendar-buttons">
            <button class="open-case-btn-small" onclick="openCaseFromCalendar('${h.caseId}')">کیس کھولیں</button>
            <button class="pdf-case-btn-small" onclick="printCasePDFFromCalendar('${h.caseId}')">📄 PDF</button>
          </div>
        </div>
      `).join('')}
    `;
  }
  window.downloadAllHearingsForDate = () => {
    const date = app.currentCalendarDate;
    if (!date) { showToast('پہلے کوئی تاریخ منتخب کریں'); return; }
    const hearings = [];
    app.cases.forEach(c => {
      c.records.forEach(rec => {
        if (rec.date === date) {
          hearings.push({
            caseName: `${c.plaintiff||'?'} vs ${c.defendant||'?'}`,
            filenum: c.filenum || '—',
            judge: c.judge || '—',
            caseType: c.casetype || '—',
            hearingDate: rec.date,
            note: rec.note || '—'
          });
        }
      });
    });
    if (hearings.length === 0) { showToast('اس تاریخ پر کوئی سماعت نہیں'); return; }
    const headers = ['کیس کا نام', 'فائل نمبر', 'جج', 'کیس قسم', 'تاریخ سماعت (dd/mm/yyyy)', 'نوٹ'];
    const rows = hearings.map(h => [h.caseName, h.filenum, h.judge, h.caseType, new Date(h.hearingDate).toLocaleDateString('en-GB'), h.note]);
    const csvContent = '\uFEFF' + [headers, ...rows].map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute('download', `Hearings_${date}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast('تمام سماعتیں ڈاؤن لوڈ ہو رہی ہیں');
  };
  window.printCasePDFFromCalendar = (caseId) => { closeAllModals(); printCasePDF(caseId); };
  window.openCaseFromCalendar = (caseId) => {
    closeAllModals();
    const c = app.cases.find(x => x.id === caseId);
    if (c) { app.currentView = 'detail'; app.selectedCaseId = caseId; document.getElementById('caseListView').style.display = 'none'; renderDetailView(c); showToast('کیس کھول دیا گیا'); } else showToast('کیس نہیں ملا');
  };

  function setTab(status) {
    app.currentTab = status;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.status === status));
    if (app.currentView === 'list') renderCaseList(); else backToList();
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadData(); renderCaseList();
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setTab(t.dataset.status)));
    document.getElementById('addNewCaseBtn').onclick = openAddCaseModal;
    document.getElementById('saveCaseBtn').onclick = saveCaseHandler;
    document.getElementById('cancelCaseBtn').onclick = () => document.getElementById('caseModal').classList.remove('open');
    document.getElementById('saveDateBtn').onclick = addRecordHandler;
    document.getElementById('cancelDateBtn').onclick = () => document.getElementById('dateRecordModal').classList.remove('open');
    document.getElementById('cancelDeleteBtn').onclick = () => document.getElementById('deleteCodeModal').classList.remove('open');
    document.getElementById('confirmDeleteBtn').onclick = confirmDeleteWithCode;
    document.getElementById('openCalendarBtn').onclick = openCalendar;
    document.getElementById('closeCalendarBtn').onclick = () => document.getElementById('calendarModal').classList.remove('open');
    document.getElementById('todayBtn').onclick = () => { const d = new Date().toISOString().slice(0,10); document.getElementById('calendarDatePicker').value = d; showHearingsForDate(d); };
    document.getElementById('searchCalendarBtn').onclick = () => { const d = document.getElementById('calendarDatePicker').value; if (d) showHearingsForDate(d); };
    document.getElementById('searchInput').addEventListener('input', () => updateSearch());
    // Dynamic fields listener
    document.getElementById('casetype').addEventListener('input', toggleCriminalFields);
    document.getElementById('casetype').addEventListener('change', toggleCriminalFields);
  });
</script>
</body>
</html>
